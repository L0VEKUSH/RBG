<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Portal — RBG School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/css/portal.css">
    <link rel="stylesheet" href="/css/csp-hardening.css">
    
</head>
<body>
    <div class="sidebar" id="sidebar"></div>
    <div class="topbar">
        <button class="topbar-hamburger" aria-label="Toggle sidebar navigation" data-csp-action-click="toggleSidebar" data-csp-args-click="%5B%5D"><i class="fas fa-bars"></i></button>
        <div class="topbar-right csp-style-0c09c5ad1d" >
            <button class="topbar-btn" aria-label="Toggle dark mode" data-csp-action-click="toggleDarkMode" data-csp-args-click="%5B%5D"><i class="fas fa-moon"></i></button>
            <div class="profile-menu"><div class="profile-avatar" id="topbarAvatar">D</div></div>
        </div>
    </div>

    <div class="main-content">
        <div class="main-inner">
            <div id="page-dashboard" class="page-section active">
                <div class="welcome-banner csp-style-cfe4ead9bd" >
                    <div class="welcome-avatar-lg"><i class="fas fa-bus"></i></div>
                    <div>
                        <h1 id="welcomeName">Welcome, Driver</h1>
                        <p>View your assigned route and students.</p>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-route"></i></div>
                        <div class="stat-content">
                            <div class="stat-value" id="statRoute">Unavailable</div>
                            <div class="stat-label">Assigned Route</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-bus-alt"></i></div>
                        <div class="stat-content">
                            <div class="stat-value" id="statBus">Unavailable</div>
                            <div class="stat-label">Bus Number</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-content">
                            <div class="stat-value" id="statStudents">Unavailable</div>
                            <div class="stat-label">Students</div>
                        </div>
                    </div>
                </div>

                <div class="charts-row">
                    <div class="card">
                        <h3 class="card-title">Trip Actions</h3>
                        <div class="quick-actions">
                            <div class="quick-action-btn"><i class="fas fa-play text-success"></i><span>Start Trip</span></div>
                            <div class="quick-action-btn"><i class="fas fa-stop text-danger"></i><span>End Trip</span></div>
                            <div class="quick-action-btn"><i class="fas fa-exclamation-triangle text-warning"></i><span>Report Issue</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="page-profile" class="page-section">
                <div class="section-header"><h2><i class="fas fa-user-circle"></i> My Profile</h2></div>
                <div class="card csp-style-2905277e2d" >
                    <div class="profile-big-avatar" id="profileBigAvatar">D</div>
                    <h3 class="text-center csp-style-b1b46ed483" id="profileName" >Name</h3>
                    <p class="text-center text-muted csp-style-b730b4e9f7" id="profileRole" >Driver</p>
                    <div class="text-center"><button class="btn btn-primary" data-csp-action-click="handleLogout" data-csp-args-click="%5B%5D">Logout</button></div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/csp-actions.js"></script>
    <script src="/js/portal-core.js"></script>
    <script src="/js/secondary-portal.js"></script>
</body></html>
