<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Portal — Sunrise Public School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/css/portal.css">
    <link rel="stylesheet" href="/css/csp-hardening.css">
    
</head>
<body>
    <div class="sidebar" id="sidebar"></div>
    <div class="topbar">
        <button class="topbar-hamburger" data-csp-action-click="toggleSidebar" data-csp-args-click="%5B%5D"><i class="fas fa-bars"></i></button>
        <div class="topbar-search"><i class="fas fa-search"></i><input type="text" placeholder="Search staff..."></div>
        <div class="topbar-right">
            <button class="topbar-btn" data-csp-action-click="toggleDarkMode" data-csp-args-click="%5B%5D"><i class="fas fa-moon"></i></button>
            <div class="profile-menu"><div class="profile-avatar" id="topbarAvatar">H</div></div>
        </div>
    </div>

    <div class="main-content">
        <div class="main-inner">
            <div id="page-dashboard" class="page-section active">
                <div class="welcome-banner csp-style-5e2d734ad3" >
                    <div class="welcome-avatar-lg"><i class="fas fa-id-badge"></i></div>
                    <div>
                        <h1 id="welcomeName">Welcome, HR Manager</h1>
                        <p>Manage staff profiles, attendance, and leave requests.</p>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-users-cog"></i></div>
                        <div class="stat-content">
                            <div class="stat-value" id="statStaff">0</div>
                            <div class="stat-label">Total Staff</div>
                        </div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-icon"><i class="fas fa-plane-departure"></i></div>
                        <div class="stat-content">
                            <div class="stat-value" id="statLeave">0</div>
                            <div class="stat-label">On Leave Today</div>
                        </div>
                    </div>
                </div>

                <div class="charts-row">
                    <div class="card">
                        <h3 class="card-title">HR Actions</h3>
                        <div class="quick-actions">
                            <div class="quick-action-btn"><i class="fas fa-user-plus text-primary"></i><span>Onboard Staff</span></div>
                            <div class="quick-action-btn"><i class="fas fa-calendar-check text-warning"></i><span>Leave Requests</span></div>
                            <div class="quick-action-btn"><i class="fas fa-file-invoice text-info"></i><span>Payroll Reports</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="page-profile" class="page-section">
                <div class="section-header"><h2><i class="fas fa-user-circle"></i> My Profile</h2></div>
                <div class="card csp-style-2905277e2d" >
                    <div class="profile-big-avatar" id="profileBigAvatar">H</div>
                    <h3 class="text-center csp-style-b1b46ed483" id="profileName" >Name</h3>
                    <p class="text-center text-muted csp-style-b730b4e9f7" id="profileRole" >HR Manager</p>
                    <div class="text-center"><button class="btn btn-primary" data-csp-action-click="handleLogout" data-csp-args-click="%5B%5D">Logout</button></div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/csp-actions.js"></script>
    <script src="/js/portal-core.js"></script>
    <script src="/js/secondary-portal.js"></script>
</body></html>
