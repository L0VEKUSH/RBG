<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student ID Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/print-templates.css">
    <script src="/js/print-templates.js"></script>
</head>
<body class="id-card-body">
    <button type="button" class="no-print btn-print btn-print-dark" aria-label="Print Student ID Card">Print ID Card</button>
    <div class="id-card">
        <div class="id-header">
            RBG SCHOOL
        </div>
        <div class="id-photo-container">
            <!-- Placeholder for photo -->
            <img src="https://via.placeholder.com/70x85?text=Photo" alt="Student Photo" class="id-photo" id="studentPhoto">
        </div>
        <div class="id-body">
            <div class="id-name" id="studentName">Loading...</div>
            <div class="id-role">Student</div>
            <div class="id-details">
                <div><strong>ID:</strong> <span id="studentId">...</span></div>
                <div><strong>Class:</strong> <span id="className">...</span></div>
                <div><strong>DOB:</strong> <span id="dob">...</span></div>
                <div><strong>Blood Grp:</strong> <span id="bloodGroup">...</span></div>
                <div><strong>Contact:</strong> <span id="contact">...</span></div>
            </div>
        </div>
        <div class="id-footer">
            Nagla Dhak Aligarh 202002<br>Ph: 9105649342
        </div>
    </div>
</body>
</html>
