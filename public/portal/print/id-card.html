<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student ID Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
        .id-card { 
            width: 2.125in; 
            height: 3.375in; 
            background: #fff; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            overflow: hidden; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #ccc;
        }
        .id-header { 
            background: #e74c3c; 
            color: white; 
            text-align: center; 
            padding: 10px 5px; 
            font-size: 11px; 
            font-weight: 700; 
            line-height: 1.2;
        }
        .id-photo-container { 
            text-align: center; 
            margin-top: 10px; 
        }
        .id-photo { 
            width: 70px; 
            height: 85px; 
            background: #eee; 
            border: 2px solid #e74c3c; 
            border-radius: 5px; 
            display: inline-block; 
            object-fit: cover;
        }
        .id-body { 
            padding: 10px; 
            text-align: center; 
            flex: 1;
        }
        .id-name { 
            font-size: 14px; 
            font-weight: 700; 
            color: #333; 
            margin: 5px 0 2px 0; 
        }
        .id-role { 
            font-size: 10px; 
            color: #777; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        .id-details { 
            font-size: 9px; 
            text-align: left; 
            color: #444; 
            line-height: 1.5; 
            margin: 0 auto; 
            width: 85%;
        }
        .id-footer { 
            background: #2c3e50; 
            color: white; 
            text-align: center; 
            padding: 8px 5px; 
            font-size: 8px; 
        }
        @media print {
            body { padding: 0; background: none; justify-content: flex-start; align-items: flex-start; }
            .id-card { box-shadow: none; border-radius: 0; page-break-inside: avoid; margin-bottom: 10px; }
            .no-print { display: none; }
        }
        .btn-print { margin: 20px auto; padding: 10px 20px; background: #2c3e50; color: #fff; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <button class="no-print btn-print" onclick="window.print()">Print ID Card</button>
    <div class="id-card">
        <div class="id-header">
            SUNRISE PUBLIC SCHOOL
        </div>
        <div class="id-photo-container">
            <!-- Placeholder for photo -->
            <img src="https://via.placeholder.com/70x85?text=Photo" alt="Student Photo" class="id-photo" id="studentPhoto">
        </div>
        <div class="id-body">
            <div class="id-name" id="studentName">Loading...</div>
            <div class="id-role">Student</div>
            <div class="id-details">
                <div><strong>ID:</strong> <span id="studentId">...</span></div>
                <div><strong>Class:</strong> <span id="className">...</span></div>
                <div><strong>DOB:</strong> <span id="dob">...</span></div>
                <div><strong>Blood Grp:</strong> <span id="bloodGroup">...</span></div>
                <div><strong>Contact:</strong> <span id="contact">...</span></div>
            </div>
        </div>
        <div class="id-footer">
            123 Education Lane, Knowledge City<br>Ph: +1 234 567 8900
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const data = {
                    name: 'Emma Watson',
                    id: 'STU-2023-445',
                    className: 'IX-C',
                    dob: '12-May-2009',
                    bloodGroup: 'O+',
                    contact: '9876543210'
                };

                document.getElementById('studentName').innerText = data.name;
                document.getElementById('studentId').innerText = data.id;
                document.getElementById('className').innerText = data.className;
                document.getElementById('dob').innerText = data.dob;
                document.getElementById('bloodGroup').innerText = data.bloodGroup;
                document.getElementById('contact').innerText = data.contact;
            }, 300);
        });
    </script>
</body>
</html>
